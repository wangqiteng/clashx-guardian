name: Windows preview
on:
  workflow_dispatch:
  push:
    paths: ['Windows/**', 'script/package_windows.sh', '.github/workflows/windows-preview.yml']
  pull_request:
    paths: ['Windows/**', 'script/package_windows.sh', '.github/workflows/windows-preview.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and package
        shell: pwsh
        run: ./Windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: IKuuu-Guardian-Windows-x64-preview
          path: |
            outputs/IKuuu-Guardian-v0.1.0-preview-win-x64.zip
            outputs/IKuuu-Guardian-v0.1.0-preview-win-x64.zip.sha256
          if-no-files-found: error
